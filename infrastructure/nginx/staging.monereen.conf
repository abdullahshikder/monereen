server {
    listen 80;
    listen [::]:80;
    server_name staging.monereen.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/monereen-acme;
    }

    location / {
        return 301 https://staging.monereen.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.monereen.com;

    ssl_certificate /etc/letsencrypt/live/staging.monereen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.monereen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/monereen-cloudflare-real-ip.conf;
    if ($monereen_trusted_origin = 0) { return 403; }

    root /var/www/staging.monereen.com;
    index index.html;
    server_tokens off;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = / {
        return 302 /mrwireframe;
    }

    location = /mrwireframe {
        try_files /mrwireframe/index.html =404;
    }

    location = /mrwireframe/ {
        return 301 /mrwireframe;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

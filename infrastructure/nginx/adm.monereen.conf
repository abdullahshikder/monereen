server {
    listen 80;
    listen [::]:80;
    server_name adm.monereen.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/monereen-acme;
    }

    location / {
        return 301 https://adm.monereen.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adm.monereen.com;

    ssl_certificate /etc/letsencrypt/live/adm.monereen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adm.monereen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/monereen-cloudflare-real-ip.conf;
    if ($monereen_trusted_origin = 0) { return 403; }

    server_tokens off;
    client_max_body_size 25m;

    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location = / {
        return 302 /app;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name monereen.com www.monereen.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/monereen-acme;
    }
    location / { return 301 https://monereen.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.monereen.com;
    ssl_certificate /etc/letsencrypt/live/monereen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monereen.com/privkey.pem;
    include /etc/nginx/snippets/monereen-cloudflare-real-ip.conf;
    if ($monereen_trusted_origin = 0) { return 403; }
    return 301 https://monereen.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monereen.com;
    ssl_certificate /etc/letsencrypt/live/monereen.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monereen.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/monereen-cloudflare-real-ip.conf;
    if ($monereen_trusted_origin = 0) { return 403; }
    client_max_body_size 25m;
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location ~ ^/auth/user/ {
        limit_req zone=monereen_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9000;
    }
    location ~ ^/(app|admin|auth|store|health|static)(/|$) {
        proxy_pass http://127.0.0.1:9000;
    }
    location ^~ /monereen-media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9002;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
